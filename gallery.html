        // ---------------- 1. 动态背景色自适应过渡 ----------------
        function initAdaptiveBackground(imgSrc) {
            const img = new Image();
            img.src = imgSrc;
            img.onload = () => {
                try {
                    const canvas = document.createElement('canvas');
                    canvas.width = 1;
                    canvas.height = 1;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, 1, 1);
                    const [r, g, b] = ctx.getImageData(0, 0, 1, 1).data;
                    
                    const blend = (c) => Math.round(c * 0.2 + 230 * 0.8);
                    const finalR = blend(r);
                    const finalG = blend(g);
                    const finalB = blend(b);
                    
                    const wrapper = document.getElementById('content-wrapper');
                    if (wrapper) {
                        wrapper.style.backgroundColor = `rgba(${finalR}, ${finalG}, ${finalB}, 0.25)`;
                    }
                } catch (e) {
                    console.warn("背景色自适应提取失败，使用默认值:", e);
                    useDefaultBackground();
                }
            };
            img.onerror = () => {
                console.warn("背景色自适应提取图片加载失败，使用默认值");
                useDefaultBackground();
            };
        }

        let lightboxImages = [];
        let currentLightboxIndex = 0;
        
        async function loadGalleryImages() {
            const row1 = document.getElementById('marquee-row-1');
            const row2 = document.getElementById('marquee-row-2');
            const row3 = document.getElementById('marquee-row-3');
            
            let images = [];
            
            try {
                const response = await fetch('data/content.json');
                if (response.ok) {
                    const data = await response.json();
                    images = data.galleryImages || [];
                }
            } catch (error) {
                console.warn('无法加载 content.json (可能是本地CORS限制)，将启用本地数组兜底:', error);
            }
            
            if (!images || images.length === 0) {
                images = LOCAL_IMAGES_FALLBACK;
            }
            
            if (images.length > 0) {
                initAdaptiveBackground(images[0]);
            } else {
                useDefaultBackground();
            }
            
            const uniqueCount = 15;
            const row1Images = images.slice(0, uniqueCount);
            const row2Images = images.slice(uniqueCount, uniqueCount * 2);
            const row3Images = images.slice(uniqueCount * 2, uniqueCount * 3);
            
            lightboxImages = [...row1Images, ...row2Images, ...row3Images];
            
            const renderRow = async (container, imgs, startIndex) => {
                const promises = [];
                for (let repeat = 0; repeat < 2; repeat++) {
                    for (let i = 0; i < imgs.length; i++) {
                        const globalIndex = startIndex + i;
                        
                        const img = document.createElement('img');
                        img.className = 'gallery-square rounded-[2rem] object-cover border-4 border-white shadow-md hover:shadow-xl transition-all duration-500 opacity-0';
                        img.loading = 'lazy';
                        img.dataset.index = globalIndex;
                        img.addEventListener('click', () => openLightbox(globalIndex));
                        container.appendChild(img);
                        
                        const loadPromise = new Promise((resolve) => {
                            const tempImg = new Image();
                            tempImg.onload = () => {
                                const ratio = tempImg.naturalWidth / tempImg.naturalHeight;
                                let orientClass;
                                
                                if (ratio > 1.2) {
                                    orientClass = 'gallery-landscape';
                                } else if (ratio < 0.8) {
                                    orientClass = 'gallery-portrait';
                                } else {
                                    orientClass = 'gallery-square';
                                }
                                
                                img.className = `${orientClass} rounded-[2rem] object-cover border-4 border-white shadow-md hover:shadow-xl transition-all duration-500 hover:-translate-y-1.5 opacity-100`;
                                img.src = imgs[i];
                                resolve();
                            };
                            tempImg.onerror = () => {
                                console.warn(`图片加载失败: ${imgs[i]}`);
                                img.remove();
                                resolve();
                            };
                            tempImg.src = imgs[i];
                        });
                        promises.push(loadPromise);
                    }
                }
                await Promise.all(promises);
            };
            
            try {
                await Promise.all([
                    renderRow(row1, row1Images, 0),
                    renderRow(row2, row2Images, uniqueCount),
                    renderRow(row3, row3Images, uniqueCount * 2)
                ]);
            } catch (err) {
                console.error("渲染跑马灯行出现错误:", err);
            }
        }
        loadGalleryImages();

        // ---------------- 3. Lightbox 大图查看器交互控制 ----------------
        function openLightbox(index) {
            currentLightboxIndex = index;
            const lightbox = document.getElementById('lightbox');
            const lightboxImg = document.getElementById('lightbox-img');
            const lightboxCounter = document.getElementById('lightbox-counter');
            
            lightboxImg.src = lightboxImages[index];
            lightboxCounter.textContent = `${index + 1} / ${lightboxImages.length}`;
            
            lightbox.classList.remove('hidden');
            setTimeout(() => lightbox.classList.add('active'), 10);
            
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            const lightbox = document.getElementById('lightbox');
            lightbox.classList.remove('active');
            setTimeout(() => lightbox.classList.add('hidden'), 300);
            
            document.body.style.overflow = '';
        }

        function navigateLightbox(direction) {
            currentLightboxIndex = (currentLightboxIndex + direction + lightboxImages.length) % lightboxImages.length;
            const lightboxImg = document.getElementById('lightbox-img');
            const lightboxCounter = document.getElementById('lightbox-counter');
            
            lightboxImg.src = lightboxImages[currentLightboxIndex];
            lightboxCounter.textContent = `${currentLightboxIndex + 1} / ${lightboxImages.length}`;
        }

        document.getElementById('lightbox-close').addEventListener('click', closeLightbox);
        document.getElementById('lightbox-prev').addEventListener('click', () => navigateLightbox(-1));
        document.getElementById('lightbox-next').addEventListener('click', () => navigateLightbox(1));
        
        document.getElementById('lightbox').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) closeLightbox();
        });

        document.addEventListener('keydown', (e) => {
            const lightbox = document.getElementById('lightbox');
            if (lightbox.classList.contains('hidden')) return;
            
            switch(e.key) {
                case 'Escape':
                    closeLightbox();
                    break;
                case 'ArrowLeft':
                    navigateLightbox(-1);
                    break;
                case 'ArrowRight':
                    navigateLightbox(1);
                    break;
            }
        });

        // ---------------- 4. 移动端汉堡侧边栏逻辑 ----------------
        const mobileMenuBtn = document.getElementById('mobile-menu-btn');
        const mobileSidebar = document.getElementById('mobile-sidebar');
        const mobileSidebarContent = document.getElementById('mobile-sidebar-content');
        const mobileSidebarOverlay = document.getElementById('mobile-sidebar-overlay');
        const mobileMenuClose = document.getElementById('mobile-menu-close');

        function openMobileMenu() {
            mobileSidebar.classList.remove('hidden');
            setTimeout(() => {
                mobileSidebarContent.classList.remove('-translate-x-full');
            }, 10);
            document.body.style.overflow = 'hidden';
        }

        function closeMobileMenu() {
            mobileSidebarContent.classList.add('-translate-x-full');
            setTimeout(() => {
                mobileSidebar.classList.add('hidden');
            }, 300);
            document.body.style.overflow = '';
        }

        mobileMenuBtn.addEventListener('click', openMobileMenu);
        mobileMenuClose.addEventListener('click', closeMobileMenu);
        mobileSidebarOverlay.addEventListener('click', closeMobileMenu);

        document.querySelectorAll('.mobile-nav-link').forEach(link => {
            link.addEventListener('click', closeMobileMenu);
        });

        // ---------------- 5. GSAP 滚动触发动画 ----------------
        window.addEventListener('load', () => {
            gsap.registerPlugin(ScrollTrigger);
            
            gsap.from("#content-wrapper h1, #content-wrapper p", {
                y: 30,
                opacity: 0,
                duration: 1,
                stagger: 0.2,
                ease: "power2.out"
            });
        });
    </script>
</body>
</html>
